[project]
name = "cacm-demo-anthropic"
version = "0.1.0"
description = "Harness SDK + Anthropic GenAI tracing demo (support-ticket triage)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "harness-sdk[anthropic]>=1.0.7",
    "anthropic>=0.40.0",
    # harness-sdk[anthropic] already depends on this instrumentor
    # transitively, but it's pinned explicitly here (unlike openai/'s
    # implicit httpx-only extra) so this demo's lockfile controls its
    # version directly. This is the package that patches
    # anthropic.Anthropic().messages.create -- a version drift here is
    # exactly the kind of thing that silently changes which gen_ai.*
    # attributes get emitted, with no error.
    "opentelemetry-instrumentation-anthropic>=0.4.4",
    # opentelemetry-instrumentation-anthropic builds its gen_ai.* attributes
    # (including the cache-exclusive input_tokens count -- see README "What
    # to look for") through this shared schema/normalization package.
    # Pinned explicitly for the same drift-risk reason as the instrumentor
    # above: it's the layer that shapes the attributes underneath it.
    "opentelemetry-util-genai>=0.1b0",
    # main.py reads TRACE_TARGET / HARNESS_ACCOUNT_ID / HARNESS_REPORTING_TOKEN /
    # ANTHROPIC_* from a .env file (see .env.example) -- neither uv nor
    # Python loads .env files on its own.
    "python-dotenv>=1.0.0",
]
