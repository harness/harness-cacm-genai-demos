services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: cacm-demos-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4418:4318"   # OTLP HTTP receiver — remapped, see README.md
      - "4417:4317"   # OTLP gRPC receiver — remapped, see README.md
